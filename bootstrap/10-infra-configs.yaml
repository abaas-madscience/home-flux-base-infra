---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: 10-infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: 00-infra-operators
  wait: true
  timeout: 10m
  interval: 10m
  path: ../10-infra-configs/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
